import groovy.json.JsonSlurper

plugins {
    alias(libs.plugins.android.application)
}

def configFile = rootProject.file("app-config.json")
def appConfig = new JsonSlurper().parse(configFile)

android {
    namespace = 'jp.wamsoft.krkrz'
    compileSdk appConfig.compileSdk

    ndkVersion = appConfig.ndkVersion

    defaultConfig {
        applicationId appConfig.applicationId
        minSdk appConfig.minSdk
        targetSdk appConfig.targetSdk

        versionCode appConfig.versionCode
        versionName appConfig.versionName

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments '-DANDROID_STL=c++_shared',
                          "-DCMAKE_TOOLCHAIN_FILE=${System.getenv('VCPKG_ROOT')}/scripts/buildsystems/vcpkg.cmake",
                          "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${android.ndkDirectory}/build/cmake/android.toolchain.cmake",
                          "-DANDROID_NDK_HOME=${android.ndkDirectory}"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version = "3.22.1"
        }
    }

    sourceSets {
        main {
            assets.srcDirs += ["${System.getenv('KRKRZ_BASE')}/krkrz_dev/src/core/resource"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        prefab = true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    fileTree(dir: 'libs', include: ['*.aar']).each { file ->
        implementation files(file)
    }
}