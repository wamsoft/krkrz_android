import groovy.json.JsonSlurper

plugins {
    alias(libs.plugins.android.application)
}

// Load local.properties early (used for signing config and APP_CONFIG_FILE override)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(localPropsFile.newDataInputStream())
}

// ${VAR} expansion used across this file. Reserved:
//   ${BUILD_SYSTEM_DIR} = this repository (gradle / cmake / cpp sources). Always fixed.
//   ${PROJECT_DIR}      = per-app project folder (app-config.json + resources + build output).
//                         Falls back to BUILD_SYSTEM_DIR when env var PROJECT_DIR is unset.
// Other names resolve from process environment (empty string if undefined).
// Both vars are resolved in settings.gradle and stored on gradle.ext.
def buildSystemDir = (gradle.ext.BUILD_SYSTEM_DIR as File).absolutePath
def projectDirPath = (gradle.ext.PROJECT_DIR as File).absolutePath
def expandEnv = { String s ->
    if (s == null) return null
    return s.replaceAll(/\$\{([A-Za-z_][A-Za-z0-9_]*)\}/) { match, var ->
        if (var == 'BUILD_SYSTEM_DIR') return buildSystemDir
        if (var == 'PROJECT_DIR') return projectDirPath
        def v = System.getenv(var)
        return v != null ? v : ''
    }
}
// Resolve a path string: expand ${...} vars, then if relative, resolve against ${PROJECT_DIR}.
def resolvePath = { String s ->
    def expanded = expandEnv(s)
    if (expanded == null || expanded.isEmpty()) return null
    def f = new File(expanded)
    return f.isAbsolute() ? f : new File(projectDirPath, expanded)
}

// Resolve app-config.json location:
//   1. local.properties: APP_CONFIG_FILE=...
//   2. env var: APP_CONFIG_FILE=...
//   3. fallback: ${PROJECT_DIR}/app-config.json
// The path supports ${ENV_VAR} expansion. Relative paths are resolved against ${PROJECT_DIR}.
def appConfigOverride = localProps['APP_CONFIG_FILE'] ?: System.getenv('APP_CONFIG_FILE')
def configFile
if (appConfigOverride) {
    configFile = resolvePath(appConfigOverride as String)
    if (!configFile.exists()) {
        throw new GradleException("APP_CONFIG_FILE points to a non-existent file: ${configFile} (from '${appConfigOverride}')")
    }
    logger.lifecycle("[app-config] using external config: ${configFile}")
} else {
    configFile = new File(projectDirPath, 'app-config.json')
    if (!configFile.exists()) {
        throw new GradleException("app-config.json not found at ${configFile}. Set PROJECT_DIR or place app-config.json in ${projectDirPath}.")
    }
}
logger.lifecycle("[build-layout] BUILD_SYSTEM_DIR=${buildSystemDir}")
logger.lifecycle("[build-layout] PROJECT_DIR     =${projectDirPath}")
def appConfig = new JsonSlurper().parse(configFile)

// --- Play Asset Delivery (PAD) packs declared in app-config.json `padPacks` ---
// Each pack becomes a generated gradle asset-pack module (see settings.gradle) and is
// referenced from android.assetPacks below. Content is copied by packPad_<name> tasks.
def padPacksConfig = (appConfig.padPacks ?: []) as List
def padPackNames = padPacksConfig.collect { it.name as String }

// --- Play Games feature toggle (single source: presence of "playgames" in cmake.plugins) ---
// The native TJS binding (app/src/main/cpp/playgames) is already gated by cmake.plugins.
// We derive the whole Java/gms/Manifest surface from the same flag so a project either has
// Play Games fully wired or not at all — no separate config key (avoids duplication).
def playGamesEnabled = ((appConfig.cmake?.plugins ?: []) as List).contains('playgames')
logger.lifecycle("[playGames] ${playGamesEnabled ? 'enabled' : 'disabled'} (from app-config.json cmake.plugins)")

// --- 読み上げ (TalkBack): cmake.plugins に "a11y" があればエンジンの KRKRZ_USE_A11Y も ON ---
// (JNI の受け口 app/src/main/cpp/a11y + Java の jp.wamsoft.krkrz.a11y は常にコンパイルされ、
//  native が無いビルドでは実行時に無効になる。docs/android-accessibility.md)
def a11yEnabled = ((appConfig.cmake?.plugins ?: []) as List).contains('a11y')
logger.lifecycle("[a11y] ${a11yEnabled ? 'enabled' : 'disabled'} (from app-config.json cmake.plugins)")

// --- apk: rename outputs (<baseName>-<versionName>-<variant>.{apk,aab}) ---
def apkConfig = appConfig.apk
def apkBaseNameFull = null  // "<baseName>-<versionName>"
if (apkConfig) {
    def baseName = (apkConfig.baseName ?: 'app') as String
    apkBaseNameFull = "${baseName}-${appConfig.versionName}"
}

android {
    namespace = 'jp.wamsoft.krkrz'
    compileSdk appConfig.compileSdk

    ndkVersion = appConfig.ndkVersion

    // Wire generated PAD asset pack modules (no-op when padPacks is absent → sample stays unchanged).
    if (!padPackNames.isEmpty()) {
        assetPacks = padPackNames.collect { ":${it}".toString() }
    }

    signingConfigs {
        release {
            storeFile file(localProps['RELEASE_STORE_FILE'] ?: System.getenv('RELEASE_STORE_FILE') ?: 'release-key.jks')
            storePassword localProps['RELEASE_STORE_PASSWORD'] ?: System.getenv('RELEASE_STORE_PASSWORD')
            keyAlias localProps['RELEASE_KEY_ALIAS'] ?: System.getenv('RELEASE_KEY_ALIAS')
            keyPassword localProps['RELEASE_KEY_PASSWORD'] ?: System.getenv('RELEASE_KEY_PASSWORD')
        }
    }

    defaultConfig {
        applicationId appConfig.applicationId
        minSdk appConfig.minSdk
        targetSdk appConfig.targetSdk

        versionCode appConfig.versionCode
        versionName appConfig.versionName

        if (appConfig.manifestPlaceholders) {
            manifestPlaceholders.putAll(appConfig.manifestPlaceholders.collectEntries { k, v -> [(k as String): (v as String)] })
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments '-DANDROID_STL=c++_shared',
                          "-DCMAKE_TOOLCHAIN_FILE=${System.getenv('VCPKG_ROOT')}/scripts/buildsystems/vcpkg.cmake",
                          "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${android.ndkDirectory}/build/cmake/android.toolchain.cmake",
                          "-DANDROID_NDK_HOME=${android.ndkDirectory}",
                          "-DMYAPP_CMAKE_FILE=${layout.buildDirectory.file('generated/cmake/myapp.cmake').get().asFile.absolutePath.replace('\\', '/')}",
                          '-DKRKRZ_DRAW_STATS=ON',
                          "-DKRKRZ_USE_A11Y=${a11yEnabled ? 'ON' : 'OFF'}"
                // パッケージするのは libkrkrz.so だけ。これを指定しないと AGP が
                // CMake の全ターゲット (thorvg のサンプル exe 等) までビルドしようとし、
                // Android NDK で通らないサンプル (tvg-ft-text-sample の basename 衝突等)
                // で失敗する。krkrz とその依存だけに絞る。
                targets 'krkrz'
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // native (libkrkrz.so 等) のデバッグシンボルを AAB に含め、Play がネイティブ
            // クラッシュをシンボル化できるようにする。配信 APK からは除去されるので
            // ユーザーの DL サイズは増えない。SYMBOL_TABLE=関数名まで / FULL=行番号まで(大)。
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
        }
        releaseDebugSigned {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version = "3.22.1"
        }
    }

    sourceSets {
        main {
            // External assets (engine resources etc.) are routed through packAssets into
            // a single generated dir so duplicates are resolved in packAssets (first-wins)
            // instead of failing in AGP's mergeAssets.
            assets.srcDirs += [layout.buildDirectory.dir("generated/assetPack").get().asFile]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        prefab = true
    }
}

// --- PAD fast local-testing wiring (opt-in via -PpadLocalTesting) ---
// bundletool --local-testing injects <meta-data local_testing_dir="local_testing"> into the base
// manifest so the Play asset-delivery library reads packs from getExternalFilesDir()/local_testing/
// instead of fetching from Play. The fast code-only iteration path (scripts/pad-fast-install.sh)
// builds a plain assembleDebug APK and needs that same wiring — added here only when
// -PpadLocalTesting is passed, and only to the debug build type's manifest overlay so it can NEVER
// reach a release AAB (which would break real Play delivery). See docs/android-play-asset-delivery.md.
if (project.hasProperty('padLocalTesting')) {
    android.sourceSets.getByName('debug').manifest.srcFile(
            "${buildSystemDir}/app/src/padlocal/AndroidManifest.xml")
    logger.lifecycle("[padLocalTesting] debug manifest overlay enabled (meta-data local_testing_dir)")
}

// --- Play Games: include/exclude the gms-touching layer based on playGamesEnabled ---
// The gms-importing Java (jp.wamsoft.krkrz.playgames.* / ui.PlayGamesAdminActivity) and the
// real PlayGamesHook live under app/src/playgames/java; a no-op PlayGamesHook stub lives under
// app/src/nogames/java. Exactly one is added to the main source set so KrkrzActivity (which only
// references PlayGamesHook) always compiles, while gms is only pulled in when enabled.
if (playGamesEnabled) {
    android.sourceSets.getByName('main').java.srcDir("${buildSystemDir}/app/src/playgames/java")
} else {
    android.sourceSets.getByName('main').java.srcDir("${buildSystemDir}/app/src/nogames/java")
    // The committed AndroidManifest keeps the Play Games entries (gms meta-data + admin activity)
    // wrapped in PLAYGAMES:BEGIN/END markers. When disabled those reference gms resources/classes
    // that are not present, so strip the marked blocks into a generated manifest and use that.
    // (Generation only happens on the opt-out path; enabled builds use the committed manifest
    // as-is, which keeps padlocal's debug overlay from colliding with a main-manifest override.)
    def strippedManifest = layout.buildDirectory.file('generated/manifest/AndroidManifest.xml').get().asFile
    strippedManifest.parentFile.mkdirs()
    def baseManifest = new File("${buildSystemDir}/app/src/main/AndroidManifest.xml").text
    strippedManifest.text = baseManifest.replaceAll(
            /(?s)<!--\s*PLAYGAMES:BEGIN.*?PLAYGAMES:END\s*-->\r?\n?/, '')
    android.sourceSets.getByName('main').manifest.srcFile(strippedManifest)
    logger.lifecycle("[playGames] disabled: stripped Play Games manifest entries -> ${strippedManifest}")
}

// --- assetPack / padPacks: copy engine shared by in-APK assets and PAD asset packs ---
def assetPackOutputDir = layout.buildDirectory.dir("generated/assetPack").get().asFile
def assetPackConfig = appConfig.assetPack

// Resolve baseFolder once (used by both packAssets and resOverride).
// `${PROJECT_DIR}` refers to the rootProject root (this Android project).
def assetPackBaseFolder = null
if (assetPackConfig?.baseFolder) {
    assetPackBaseFolder = resolvePath(assetPackConfig.baseFolder as String)
}

// Resolve a source's `from` to an absolute File, against a given baseFolder.
//   - absolute path (after ${...} expansion) is used as-is
//   - relative path is resolved against baseFolder
def resolveFromWith = { String rawFrom, File baseFolder ->
    def expanded = expandEnv(rawFrom)
    def f = new File(expanded)
    if (f.isAbsolute()) return f
    if (baseFolder == null) {
        throw new GradleException("[assetPack] 'from' is relative ('${rawFrom}') but 'baseFolder' is not set")
    }
    return new File(baseFolder, expanded)
}

// Copy engine: mirror/flatten `sources` into `outDir`, pruning stale files.
// Reused verbatim by the in-APK packAssets task and every packPad_<name> task.
// `label` is only used in log lines. `transferMode` is 'copy' or 'hardlink'.
def runCopyRules = { List sources, File outDir, File baseFolder, String transferMode, String label ->
    if (transferMode != 'copy' && transferMode != 'hardlink') {
        throw new GradleException("[${label}] unknown transfer '${transferMode}' (must be 'copy' or 'hardlink')")
    }
    outDir.mkdirs()

    // 1. Build expected map (destRelPath -> sourceFile) from all sources
    def expected = [:]
    sources.each { src ->
        def type = src.type as String
        if (type != 'mirror' && type != 'flatten') {
            throw new GradleException("[${label}] unknown type '${type}' (must be 'mirror' or 'flatten')")
        }
        if (!src.from) {
            throw new GradleException("[${label}] 'from' is required")
        }
        def rawFrom = src.from as String
        def fromDir = resolveFromWith(rawFrom, baseFolder)
        def fromIsAbsolute = new File(expandEnv(rawFrom)).isAbsolute()

        // Default `to`:
        //   - mirror + relative `from` → same as `from` (preserve subtree)
        //   - mirror + absolute `from` → last folder name of `from`
        //   - flatten → '' (root)
        // Explicit `to` (including `""`) wins.
        def toPath
        if (src.containsKey('to')) {
            toPath = (src.to ?: '') as String
        } else if (type == 'mirror') {
            toPath = fromIsAbsolute ? fromDir.name : rawFrom
        } else {
            toPath = ''
        }

        def includes = (src.include ?: ['**/*']) as List
        def excludes = (src.exclude ?: []) as List

        if (!fromDir.exists()) {
            logger.warn("[${label}] source folder not found, skipped: ${fromDir}")
            return
        }

        fileTree(dir: fromDir, includes: includes, excludes: excludes).each { srcFile ->
            def destRel
            if (type == 'mirror') {
                def rel = fromDir.toPath().relativize(srcFile.toPath()).toString().replace('\\', '/')
                destRel = toPath ? "${toPath}/${rel}" : rel
            } else {
                destRel = toPath ? "${toPath}/${srcFile.name}" : srcFile.name
            }
            destRel = destRel.replaceAll(/^\/+/, '')

            if (expected.containsKey(destRel)) {
                logger.warn("[${label}] duplicate skipped (first wins): assets/${destRel}")
                logger.warn("            kept   : ${expected[destRel]}")
                logger.warn("            skipped: ${srcFile}")
                return
            }
            expected[destRel] = srcFile
        }
    }

    // 2. Remove stale files (no longer present in any source)
    int removed = 0
    if (outDir.exists()) {
        outDir.eachFileRecurse(groovy.io.FileType.FILES) { existing ->
            def rel = outDir.toPath().relativize(existing.toPath()).toString().replace('\\', '/')
            if (!expected.containsKey(rel)) {
                existing.delete()
                removed++
            }
        }
        // Remove now-empty directories (bottom-up)
        def dirs = []
        outDir.eachFileRecurse(groovy.io.FileType.DIRECTORIES) { dirs << it }
        dirs.sort { -it.absolutePath.length() }.each { d ->
            if (d.list().length == 0) d.delete()
        }
    }

    // 3. Transfer new / changed files only (preserve timestamps so downstream tasks see no spurious diffs)
    int linked = 0
    int copied = 0
    int unchanged = 0
    int linkFailures = 0
    expected.each { destRel, srcFile ->
        def destFile = new File(outDir, destRel)
        def needsTransfer = !destFile.exists() ||
                destFile.length() != srcFile.length() ||
                destFile.lastModified() != srcFile.lastModified()
        if (!needsTransfer) {
            unchanged++
            return
        }
        if (destFile.exists()) destFile.delete()
        destFile.parentFile.mkdirs()

        boolean didLink = false
        if (transferMode == 'hardlink') {
            try {
                java.nio.file.Files.createLink(destFile.toPath(), srcFile.toPath())
                didLink = true
            } catch (Exception e) {
                linkFailures++
                logger.info("[${label}] hardlink failed for ${srcFile} -> copy fallback: ${e.message}")
            }
        }
        if (!didLink) {
            java.nio.file.Files.copy(
                    srcFile.toPath(),
                    destFile.toPath(),
                    java.nio.file.StandardCopyOption.COPY_ATTRIBUTES)
            copied++
        } else {
            linked++
        }
    }

    def summary = transferMode == 'hardlink'
            ? "${linked} linked, ${copied} copied (fallback), ${unchanged} unchanged, ${removed} removed"
            : "${copied} copied, ${unchanged} unchanged, ${removed} removed"
    logger.lifecycle("[${label}] ${expected.size()} file(s) total: ${summary}")
    if (linkFailures > 0) {
        logger.warn("[${label}] ${linkFailures} file(s) fell back to copy (hardlink unsupported, e.g. cross-drive). To suppress, set transfer to 'copy'.")
    }
}

// Declare a copy task's inputs (so it is UP-TO-DATE when nothing changes).
def declareCopyInputs = { task, List sources, File baseFolder, String propPrefix, Object defObj ->
    sources.eachWithIndex { src, idx ->
        if (!src.from) return
        def fromDir = resolveFromWith(src.from as String, baseFolder)
        if (fromDir.exists()) {
            def includes = (src.include ?: ['**/*']) as List
            def excludes = (src.exclude ?: []) as List
            task.inputs.files(fileTree(dir: fromDir, includes: includes, excludes: excludes))
                    .withPropertyName("${propPrefix}-${idx}")
                    .withPathSensitivity(PathSensitivity.RELATIVE)
        }
    }
    task.inputs.property(propPrefix, defObj.toString())
}

// resOverride: overlay external res folder(s) on top of main res via buildType source sets.
// Each entry supports ${BUILD_SYSTEM_DIR} / ${PROJECT_DIR} / ${ENV_VAR} expansion; relative
// paths are resolved against ${PROJECT_DIR} (same rule as the rest of app-config.json).
if (assetPackConfig?.resOverride) {
    def overlayNames = assetPackConfig.resOverride instanceof List
            ? assetPackConfig.resOverride
            : [assetPackConfig.resOverride]
    def overlayDirs = overlayNames.collect { resolvePath(it as String) }
    android.buildTypes.configureEach { bt ->
        def ss = android.sourceSets.findByName(bt.name)
        if (ss != null) ss.res.srcDirs(*overlayDirs)
    }
}

tasks.register('packAssets') {
    group = 'build'
    description = 'Copy project files into generated assets directory based on app-config.json assetPack'

    outputs.dir(assetPackOutputDir)

    if (assetPackConfig != null) {
        def sources = (assetPackConfig.sources ?: []) as List
        def transferMode = (assetPackConfig.transfer ?: 'copy') as String
        declareCopyInputs(delegate, sources, assetPackBaseFolder, 'assetPackConfig', assetPackConfig)
        doLast {
            runCopyRules(sources, assetPackOutputDir, assetPackBaseFolder, transferMode, 'assetPack')
        }
    } else {
        doLast {
            assetPackOutputDir.deleteDir()
            assetPackOutputDir.mkdirs()
            logger.info("[assetPack] no 'assetPack' section in app-config.json, skipping")
        }
    }
}

// --- padPacks: one packPad_<name> task per PAD asset pack, copying into the generated module ---
// Each generated pack module lives at ${PROJECT_DIR}/build/android/assetpacks/<name>/ (see
// settings.gradle) and expects assets at src/main/assets/. We write directly there.
def padTaskNames = []
padPacksConfig.each { pack ->
    def name = pack.name as String
    def packBaseFolder = pack.baseFolder ? resolvePath(pack.baseFolder as String) : assetPackBaseFolder
    def packSources = (pack.sources ?: []) as List
    def packTransfer = (pack.transfer ?: 'copy') as String
    def packOutDir = new File(projectDirPath, "build/android/assetpacks/${name}/src/main/assets")
    def taskName = "packPad_${name}"
    tasks.register(taskName) {
        group = 'build'
        description = "Copy PAD asset pack '${name}' content into its generated module"
        outputs.dir(packOutDir)
        declareCopyInputs(delegate, packSources, packBaseFolder, "padPack-${name}", pack)
        doLast {
            runCopyRules(packSources, packOutDir, packBaseFolder, packTransfer, "padPack:${name}")
        }
    }
    padTaskNames << taskName

    // The asset pack module (:<name>) packages src/main/assets during :app bundle/assemble.
    // Make every task in that module wait for our copy so the assets are present first.
    // (Broad-but-safe: the copy is a quick, incremental no-op when up-to-date.)
    project(":${name}").tasks.configureEach { t ->
        if (t.name != 'clean') {
            t.dependsOn ":app:${taskName}"
        }
    }
}

// --- generatePadRes: emit a res string-array of fetch-time pack names for the runtime ---
// Only fast-follow / on-demand packs are fetched + located at runtime (install-time packs
// live in the AssetManager namespace and are handled by the existing Bootstrap copy walk).
// Always generated (empty array when none) so R.array.pad_fetch_packs always resolves.
def padResDir = layout.buildDirectory.dir("generated/res/pad").get().asFile
def padFetchPacks = padPacksConfig
        .findAll { ((it.deliveryType ?: 'on-demand') as String) in ['fast-follow', 'on-demand'] }
        .collect { it.name as String }
android.sourceSets.getByName('main').res.srcDir(padResDir)

tasks.register('generatePadRes') {
    group = 'build'
    description = 'Generate res/values/pad_packs.xml (pad_fetch_packs string-array) from app-config.json'
    outputs.dir(padResDir)
    inputs.property('padFetchPacks', padFetchPacks.toString())
    doLast {
        def valuesDir = new File(padResDir, 'values')
        valuesDir.mkdirs()
        def sb = new StringBuilder()
        sb << '<?xml version="1.0" encoding="utf-8"?>\n'
        sb << '<!-- AUTO-GENERATED from app-config.json (padPacks) — DO NOT EDIT. -->\n'
        sb << '<resources>\n'
        sb << '    <string-array name="pad_fetch_packs">\n'
        padFetchPacks.each { sb << "        <item>${it}</item>\n" }
        sb << '    </string-array>\n'
        sb << '</resources>\n'
        new File(valuesDir, 'pad_packs.xml').text = sb.toString()
        logger.lifecycle("[generatePadRes] ${padFetchPacks.size()} fetch pack(s): ${padFetchPacks}")
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'packAssets'
    dependsOn 'generatePadRes'
    padTaskNames.each { dependsOn it }
}
// R.array.pad_fetch_packs must exist before resource merge/compile.
tasks.matching { it.name.endsWith('Resources') }.configureEach {
    dependsOn 'generatePadRes'
}

// --- generateMyappCmake: write generated myapp.cmake from app-config.json cmake section ---
// File lives under :app buildDir (which is redirected to ${PROJECT_DIR}/build/android/app/),
// and the absolute path is passed to CMake via -DMYAPP_CMAKE_FILE (see defaultConfig above).
def myappCmakeFile = layout.buildDirectory.file('generated/cmake/myapp.cmake').get().asFile
def cmakeConfig = appConfig.cmake

tasks.register('generateMyappCmake') {
    group = 'build'
    description = 'Generate myapp.cmake from app-config.json cmake section'

    if (cmakeConfig != null) {
        inputs.property('cmakeConfig', cmakeConfig.toString())
        outputs.file(myappCmakeFile)

        doLast {
            def normalizePath = { String p ->
                def expanded = expandEnv(p)
                def f = new File(expanded)
                def abs = f.isAbsolute() ? f : new File(projectDirPath, expanded)
                return abs.absolutePath.replace('\\', '/')
            }

            def lines = []
            lines << "# This file is auto-generated from app-config.json (cmake section)."
            lines << "# DO NOT EDIT — your changes will be overwritten on the next build."
            lines << ""

            def folders = (cmakeConfig.pluginFolders ?: []) as List
            if (!folders.isEmpty()) {
                lines << "LIST(APPEND TVP_PLUGIN_FOLDERS"
                folders.each { lines << "  ${normalizePath(it as String)}" }
                lines << "  )"
                lines << ""
            }

            def plugins = (cmakeConfig.plugins ?: []) as List
            if (!plugins.isEmpty()) {
                lines << "LIST(APPEND TVP_PLUGINS"
                plugins.each { lines << "  ${it}" }
                lines << "  )"
                lines << ""
            }

            def staticPlugins = (cmakeConfig.staticPlugins ?: []) as List
            if (!staticPlugins.isEmpty()) {
                lines << "LIST(APPEND TVP_PLUGINS_STATIC"
                staticPlugins.each { lines << "  ${it}" }
                lines << "  )"
                lines << ""
            }

            myappCmakeFile.parentFile.mkdirs()
            myappCmakeFile.text = lines.join('\n')
            logger.lifecycle("[generateMyappCmake] wrote ${myappCmakeFile}")
        }
    } else {
        doLast {
            logger.info("[generateMyappCmake] no 'cmake' section in app-config.json, skipping")
        }
    }
}

tasks.matching {
    it.name == 'preBuild' ||
            it.name.startsWith('configureCMake') ||
            it.name.startsWith('externalNativeBuild')
}.configureEach {
    dependsOn 'generateMyappCmake'
}

// --- apk filename override + optional outputDir mirror (link or copy) ---
if (apkBaseNameFull) {
    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "${apkBaseNameFull}-${variant.name}.apk"
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    // Play Asset Delivery runtime (fetch + locate fast-follow/on-demand packs).
    // Referenced unconditionally by BootstrapActivity; a no-op when padPacks is absent.
    implementation 'com.google.android.play:asset-delivery:2.3.0'
    // Google Play Games Services (v2) — only when playgames is enabled in app-config.json.
    // Kept out entirely otherwise so opt-out projects ship no gms code (see playGamesEnabled).
    if (playGamesEnabled) {
        implementation 'com.google.android.gms:play-services-games-v2:20.1.2'
        implementation 'com.google.android.gms:play-services-auth:21.2.0'
        implementation 'com.google.android.gms:play-services-tasks:18.2.0'
    }
    fileTree(dir: 'libs', include: ['*.aar']).each { file ->
        implementation files(file)
    }
}