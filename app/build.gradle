import groovy.json.JsonSlurper

plugins {
    alias(libs.plugins.android.application)
}

// Load local.properties early (used for signing config and APP_CONFIG_FILE override)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(localPropsFile.newDataInputStream())
}

// Resolve app-config.json location:
//   1. local.properties: APP_CONFIG_FILE=...
//   2. env var: APP_CONFIG_FILE=...
//   3. fallback: ./app-config.json (project root)
// The path supports ${ENV_VAR} expansion. Relative paths are resolved against project root.
def appConfigOverride = localProps['APP_CONFIG_FILE'] ?: System.getenv('APP_CONFIG_FILE')
def configFile
if (appConfigOverride) {
    def expanded = appConfigOverride.replaceAll(/\$\{([A-Za-z_][A-Za-z0-9_]*)\}/) { m, v ->
        def value = System.getenv(v)
        return value != null ? value : ''
    }
    def f = new File(expanded)
    configFile = f.isAbsolute() ? f : rootProject.file(expanded)
    if (!configFile.exists()) {
        throw new GradleException("APP_CONFIG_FILE points to a non-existent file: ${configFile} (from '${appConfigOverride}')")
    }
    logger.lifecycle("[app-config] using external config: ${configFile}")
} else {
    configFile = rootProject.file('app-config.json')
}
def appConfig = new JsonSlurper().parse(configFile)

// --- apk: rename outputs (<baseName>-<versionName>-<variant>.{apk,aab}) and optional copy/link to outputDir ---
def apkConfig = appConfig.apk
def apkBaseNameFull = null  // "<baseName>-<versionName>"
def apkOutputDir = null
if (apkConfig) {
    def baseName = (apkConfig.baseName ?: 'app') as String
    apkBaseNameFull = "${baseName}-${appConfig.versionName}"
    if (apkConfig.outputDir) {
        def raw = apkConfig.outputDir as String
        def expanded = raw.replaceAll(/\$\{([A-Za-z_][A-Za-z0-9_]*)\}/) { m, v ->
            def value = System.getenv(v)
            return value != null ? value : ''
        }
        def f = new File(expanded)
        apkOutputDir = f.isAbsolute() ? f : rootProject.file(expanded)
    }
}

android {
    namespace = 'jp.wamsoft.krkrz'
    compileSdk appConfig.compileSdk

    ndkVersion = appConfig.ndkVersion

    signingConfigs {
        release {
            storeFile file(localProps['RELEASE_STORE_FILE'] ?: System.getenv('RELEASE_STORE_FILE') ?: 'release-key.jks')
            storePassword localProps['RELEASE_STORE_PASSWORD'] ?: System.getenv('RELEASE_STORE_PASSWORD')
            keyAlias localProps['RELEASE_KEY_ALIAS'] ?: System.getenv('RELEASE_KEY_ALIAS')
            keyPassword localProps['RELEASE_KEY_PASSWORD'] ?: System.getenv('RELEASE_KEY_PASSWORD')
        }
    }

    defaultConfig {
        applicationId appConfig.applicationId
        minSdk appConfig.minSdk
        targetSdk appConfig.targetSdk

        versionCode appConfig.versionCode
        versionName appConfig.versionName

        if (appConfig.manifestPlaceholders) {
            manifestPlaceholders.putAll(appConfig.manifestPlaceholders.collectEntries { k, v -> [(k as String): (v as String)] })
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments '-DANDROID_STL=c++_shared',
                          "-DCMAKE_TOOLCHAIN_FILE=${System.getenv('VCPKG_ROOT')}/scripts/buildsystems/vcpkg.cmake",
                          "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${android.ndkDirectory}/build/cmake/android.toolchain.cmake",
                          "-DANDROID_NDK_HOME=${android.ndkDirectory}"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        releaseDebugSigned {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version = "3.22.1"
        }
    }

    sourceSets {
        main {
            assets.srcDirs += ["${System.getenv('KRKRZ_BASE')}/krkrz_dev/src/core/resource"]
            assets.srcDirs += [layout.buildDirectory.dir("generated/assetPack").get().asFile]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        prefab = true
    }
}

// --- assetPack: copy project files into generated assets directory ---
def assetPackOutputDir = layout.buildDirectory.dir("generated/assetPack").get().asFile
def assetPackConfig = appConfig.assetPack

static def expandEnv(String s) {
    if (s == null) return null
    return s.replaceAll(/\$\{([A-Za-z_][A-Za-z0-9_]*)\}/) { match, var ->
        def v = System.getenv(var)
        return v != null ? v : ''
    }
}

// Resolve projectFolder once (used by both packAssets and resOverride)
def assetPackProjectFolder = null
if (assetPackConfig?.projectFolder) {
    def resolved = expandEnv(assetPackConfig.projectFolder as String)
    def f = new File(resolved)
    assetPackProjectFolder = f.isAbsolute() ? f : rootProject.file(resolved)
}

// resOverride: overlay external res folder(s) on top of main res via buildType source sets
if (assetPackConfig?.resOverride && assetPackProjectFolder != null) {
    def overlayNames = assetPackConfig.resOverride instanceof List
            ? assetPackConfig.resOverride
            : [assetPackConfig.resOverride]
    def overlayDirs = overlayNames.collect { new File(assetPackProjectFolder, it as String) }
    android.buildTypes.configureEach { bt ->
        def ss = android.sourceSets.findByName(bt.name)
        if (ss != null) ss.res.srcDirs(*overlayDirs)
    }
}

tasks.register('packAssets') {
    group = 'build'
    description = 'Copy project files into generated assets directory based on app-config.json assetPack'

    outputs.dir(assetPackOutputDir)

    if (assetPackConfig != null) {
        def projectFolder = assetPackProjectFolder
        def sources = (assetPackConfig.sources ?: []) as List
        def transferMode = (assetPackConfig.transfer ?: 'copy') as String
        if (transferMode != 'copy' && transferMode != 'hardlink') {
            throw new GradleException("[assetPack] unknown transfer '${transferMode}' (must be 'copy' or 'hardlink')")
        }

        // Declare inputs (so the task is UP-TO-DATE when nothing changes)
        sources.each { src ->
            def fromDir = new File(projectFolder, src.from as String)
            if (fromDir.exists()) {
                def includes = (src.include ?: ['**/*']) as List
                def excludes = (src.exclude ?: []) as List
                inputs.files(fileTree(dir: fromDir, includes: includes, excludes: excludes))
                        .withPropertyName("assetPack-${src.type}-${src.from}")
                        .withPathSensitivity(PathSensitivity.RELATIVE)
            }
        }
        inputs.property('assetPackConfig', assetPackConfig.toString())

        doLast {
            assetPackOutputDir.mkdirs()

            // 1. Build expected map (destRelPath -> sourceFile) from all sources
            def expected = [:]

            sources.each { src ->
                def type = src.type as String
                if (type != 'mirror' && type != 'flatten') {
                    throw new GradleException("[assetPack] unknown type '${type}' (must be 'mirror' or 'flatten')")
                }
                if (!src.from) {
                    throw new GradleException("[assetPack] 'from' is required")
                }
                def fromDir = new File(projectFolder, src.from as String)
                def toPath = (src.to as String) ?: (type == 'mirror' ? (src.from as String) : '')
                def includes = (src.include ?: ['**/*']) as List
                def excludes = (src.exclude ?: []) as List

                if (!fromDir.exists()) {
                    logger.warn("[assetPack] source folder not found, skipped: ${fromDir}")
                    return
                }

                fileTree(dir: fromDir, includes: includes, excludes: excludes).each { srcFile ->
                    def destRel
                    if (type == 'mirror') {
                        def rel = fromDir.toPath().relativize(srcFile.toPath()).toString().replace('\\', '/')
                        destRel = toPath ? "${toPath}/${rel}" : rel
                    } else {
                        destRel = toPath ? "${toPath}/${srcFile.name}" : srcFile.name
                    }
                    destRel = destRel.replaceAll(/^\/+/, '')

                    if (expected.containsKey(destRel)) {
                        logger.warn("[assetPack] duplicate skipped (first wins): assets/${destRel}")
                        logger.warn("            kept   : ${expected[destRel]}")
                        logger.warn("            skipped: ${srcFile}")
                        return
                    }
                    expected[destRel] = srcFile
                }
            }

            // 2. Remove stale files (no longer present in any source)
            int removed = 0
            if (assetPackOutputDir.exists()) {
                assetPackOutputDir.eachFileRecurse(groovy.io.FileType.FILES) { existing ->
                    def rel = assetPackOutputDir.toPath().relativize(existing.toPath()).toString().replace('\\', '/')
                    if (!expected.containsKey(rel)) {
                        existing.delete()
                        removed++
                    }
                }
                // Remove now-empty directories (bottom-up)
                def dirs = []
                assetPackOutputDir.eachFileRecurse(groovy.io.FileType.DIRECTORIES) { dirs << it }
                dirs.sort { -it.absolutePath.length() }.each { d ->
                    if (d.list().length == 0) d.delete()
                }
            }

            // 3. Transfer new / changed files only (preserve timestamps so downstream tasks see no spurious diffs)
            int linked = 0
            int copied = 0
            int unchanged = 0
            int linkFailures = 0
            expected.each { destRel, srcFile ->
                def destFile = new File(assetPackOutputDir, destRel)
                def needsTransfer = !destFile.exists() ||
                        destFile.length() != srcFile.length() ||
                        destFile.lastModified() != srcFile.lastModified()
                if (!needsTransfer) {
                    unchanged++
                    return
                }
                if (destFile.exists()) destFile.delete()
                destFile.parentFile.mkdirs()

                boolean didLink = false
                if (transferMode == 'hardlink') {
                    try {
                        java.nio.file.Files.createLink(destFile.toPath(), srcFile.toPath())
                        didLink = true
                    } catch (Exception e) {
                        linkFailures++
                        logger.info("[assetPack] hardlink failed for ${srcFile} -> copy fallback: ${e.message}")
                    }
                }
                if (!didLink) {
                    java.nio.file.Files.copy(
                            srcFile.toPath(),
                            destFile.toPath(),
                            java.nio.file.StandardCopyOption.COPY_ATTRIBUTES)
                    copied++
                } else {
                    linked++
                }
            }

            def summary = transferMode == 'hardlink'
                    ? "${linked} linked, ${copied} copied (fallback), ${unchanged} unchanged, ${removed} removed"
                    : "${copied} copied, ${unchanged} unchanged, ${removed} removed"
            logger.lifecycle("[assetPack] ${expected.size()} file(s) total: ${summary}")
            if (linkFailures > 0) {
                logger.warn("[assetPack] ${linkFailures} file(s) fell back to copy (hardlink unsupported, e.g. cross-drive). To suppress, set transfer to 'copy'.")
            }
        }
    } else {
        doLast {
            assetPackOutputDir.deleteDir()
            assetPackOutputDir.mkdirs()
            logger.info("[assetPack] no 'assetPack' section in app-config.json, skipping")
        }
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'packAssets'
}

// --- generateMyappCmake: write generated myapp.cmake from app-config.json cmake section ---
def myappCmakeFile = layout.buildDirectory.file('generated/cmake/myapp.cmake').get().asFile
def cmakeConfig = appConfig.cmake

tasks.register('generateMyappCmake') {
    group = 'build'
    description = 'Generate myapp.cmake from app-config.json cmake section'

    if (cmakeConfig != null) {
        inputs.property('cmakeConfig', cmakeConfig.toString())
        outputs.file(myappCmakeFile)

        doLast {
            def normalizePath = { String p ->
                def expanded = expandEnv(p)
                def f = new File(expanded)
                def abs = f.isAbsolute() ? f : rootProject.file(expanded)
                return abs.absolutePath.replace('\\', '/')
            }

            def lines = []
            lines << "# This file is auto-generated from app-config.json (cmake section)."
            lines << "# DO NOT EDIT — your changes will be overwritten on the next build."
            lines << ""

            def folders = (cmakeConfig.pluginFolders ?: []) as List
            if (!folders.isEmpty()) {
                lines << "LIST(APPEND TVP_PLUGIN_FOLDERS"
                folders.each { lines << "  ${normalizePath(it as String)}" }
                lines << "  )"
                lines << ""
            }

            def plugins = (cmakeConfig.plugins ?: []) as List
            if (!plugins.isEmpty()) {
                lines << "LIST(APPEND TVP_PLUGINS"
                plugins.each { lines << "  ${it}" }
                lines << "  )"
                lines << ""
            }

            def staticPlugins = (cmakeConfig.staticPlugins ?: []) as List
            if (!staticPlugins.isEmpty()) {
                lines << "LIST(APPEND TVP_PLUGINS_STATIC"
                staticPlugins.each { lines << "  ${it}" }
                lines << "  )"
                lines << ""
            }

            myappCmakeFile.parentFile.mkdirs()
            myappCmakeFile.text = lines.join('\n')
            logger.lifecycle("[generateMyappCmake] wrote ${myappCmakeFile}")
        }
    } else {
        doLast {
            logger.info("[generateMyappCmake] no 'cmake' section in app-config.json, skipping")
        }
    }
}

tasks.matching {
    it.name == 'preBuild' ||
            it.name.startsWith('configureCMake') ||
            it.name.startsWith('externalNativeBuild')
}.configureEach {
    dependsOn 'generateMyappCmake'
}

// --- apk filename override + optional outputDir mirror (link or copy) ---
if (apkBaseNameFull) {
    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "${apkBaseNameFull}-${variant.name}.apk"
        }
    }
}

if (apkOutputDir) {
    def linkOrCopyArtifact = { src, dst ->
        if (dst.exists()) dst.delete()
        dst.parentFile.mkdirs()
        try {
            java.nio.file.Files.createLink(dst.toPath(), src.toPath())
            logger.lifecycle("[apk] linked ${dst}")
        } catch (Exception e) {
            java.nio.file.Files.copy(
                    src.toPath(), dst.toPath(),
                    java.nio.file.StandardCopyOption.COPY_ATTRIBUTES)
            logger.lifecycle("[apk] copied ${dst} (hardlink unsupported: ${e.message})")
        }
    }

    android.applicationVariants.all { variant ->
        def variantNameCapitalized = variant.name.capitalize()

        // APK: assemble<Variant>
        tasks.matching { it.name == "assemble${variantNameCapitalized}" }.configureEach { task ->
            task.doLast {
                apkOutputDir.mkdirs()
                variant.outputs.each { output ->
                    def src = output.outputFile
                    if (src && src.exists()) {
                        linkOrCopyArtifact(src, new File(apkOutputDir, src.name))
                    }
                }
            }
        }

        // AAB: bundle<Variant>. AGP keeps default name (app-<variant>.aab) at standard location;
        // we rename during the mirror copy so the artifact in outputDir matches the APK naming scheme.
        tasks.matching { it.name == "bundle${variantNameCapitalized}" }.configureEach { task ->
            task.doLast {
                apkOutputDir.mkdirs()
                def aabDir = layout.buildDirectory.dir("outputs/bundle/${variant.name}").get().asFile
                if (aabDir.exists()) {
                    aabDir.listFiles({ f -> f.name.endsWith('.aab') } as java.io.FileFilter)?.each { aab ->
                        def renamed = apkBaseNameFull
                                ? "${apkBaseNameFull}-${variant.name}.aab"
                                : aab.name
                        linkOrCopyArtifact(aab, new File(apkOutputDir, renamed))
                    }
                }
            }
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    // Google Play Games Services (v2)
    implementation 'com.google.android.gms:play-services-games-v2:20.1.2'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.android.gms:play-services-tasks:18.2.0'
    fileTree(dir: 'libs', include: ['*.aar']).each { file ->
        implementation files(file)
    }
}